<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES 자재 피킹 단말기 - SMT 라인</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/kitting.css">
    <link rel="stylesheet" href="css/common-header.css">
</head>
<body>
    <!-- Unified Topbar Header -->
    <header class="mes-unified-header" data-current-screen="kitting">
        <!-- 1. 좌측: 브랜드 & 공정 타이틀 -->
        <div class="mes-header-left">
            <span class="mes-header-brand-badge badge-kitting">KITTING OP</span>
            <div class="mes-header-titles">
                <div class="mes-header-main-title">자재 피킹 & 피더 셋업 전용 단말기</div>
                <div class="mes-header-sub-title">SMT 마운터 오삽 방지(포카요케) 및 MSL 추적</div>
            </div>
        </div>

        <!-- 2. 중앙: 현장 공정 네비게이션 버튼 (관리자/대시보드 숨김) -->
        <nav class="mes-header-center">
            <a href="kitting.html" class="mes-nav-btn active" data-screen="kitting">
                <span class="nav-icon">📦</span>
                <span>자재 피킹</span>
            </a>
            <a href="machine.html" class="mes-nav-btn" data-screen="machine">
                <span class="nav-icon">🔧</span>
                <span>설비 HMI</span>
            </a>
        </nav>

        <!-- 3. 우측: 현재 로그인 작업자, 로그아웃 -->
        <div class="mes-header-right">
            <div class="mes-user-badge" onclick="confirmTransactionReset()" title="🔄 클릭 시 기초정보(마스터) 유지 & 생산/수주 트랜잭션 실적 초기화">
                <div class="user-dot"></div>
                <span class="user-name-text" id="hdrUserName">작업자</span>
            </div>
            <button class="mes-logout-btn" onclick="mesLogout()">
                로그아웃
            </button>
        </div>
    </header>

    <!-- 2-Column Split Stage -->
    <div class="kitting-stage">
        <!-- ── Left Column: Fixed Scan Controller ── -->
        <aside class="left-control-col">
            <!-- 1. 작업지시(WO) 선택 -->
            <div class="left-header">
                <div class="wo-select-row">
                    <label class="wo-select-label" for="woSelect">작업지시 (WORK ORDER):</label>
                    <select id="woSelect" class="wo-dropdown" onchange="onWoChanged()">
                        <option value="">작업지시 로딩 중...</option>
                    </select>
                </div>
            </div>

            <!-- 2. 고정 스캔 조작 영역 -->
            <div class="left-scroll-body">
                <!-- Big Circular Progress Gauge Card -->
                <div class="circular-gauge-card">
                    <div class="gauge-header-row">
                        <span class="gauge-title-label" id="gaugeTitleLabel">피더 검증 진행률</span>
                        <div id="kpiInterlockBadge" class="interlock-badge badge-locked">
                            인터록 잠김
                        </div>
                    </div>

                    <!-- SVG Circular Gauge -->
                    <div class="circular-progress-wrap">
                        <svg class="circular-gauge" viewBox="0 0 120 120">
                            <circle class="gauge-bg" cx="60" cy="60" r="50"></circle>
                            <circle class="gauge-fill" id="gaugeCircleFill" cx="60" cy="60" r="50"></circle>
                        </svg>
                        <div class="gauge-center-content">
                            <span class="gauge-percent-text" id="gaugePercentText">0%</span>
                            <span class="gauge-count-text" id="gaugeCountText">0 / 0</span>
                            <span class="gauge-sub-label" id="gaugeSubLabel">장착 완료</span>
                        </div>
                    </div>
                </div>

                <!-- Big Scan Input Box (바코드 건 스캔 입력창) -->
                <div class="scan-action-box">
                    <div class="scan-box-title">
                        <span>바코드 스캔 입력</span>
                        <span style="font-size:10.5px; color:#94a3b8; font-weight:500;">스캐너 건 / 직접 입력</span>
                    </div>

                    <input type="text" id="scannerInput" class="scanner-input" placeholder="릴 바코드 or 품번 스캔 (Enter)" autofocus onkeypress="handleKeyScan(event)">
                    
                    <button class="btn-scan-submit" onclick="submitScan()">
                        스캔 확인 (ENTER)
                    </button>
                </div>

                <!-- Big Feedback Banner (실시간 판정 결과) -->
                <div id="feedbackBanner" class="feedback-banner">
                    <span id="feedbackText">-</span>
                </div>

                <!-- Quick Simulation Tools -->
                <div class="quick-tools-panel">
                    <span class="quick-tools-label">테스트 & 실시간 잔량 시뮬레이션:</span>
                    <div class="quick-tools-grid">
                        <button class="quick-btn pass" onclick="quickScanCorrect()">정상 릴 1건 스캔</button>
                        <button class="quick-btn fail" onclick="quickScanWrong()">오투입 릴 (에러)</button>
                        <button class="quick-btn" onclick="autoVerifyAll()">100% 일괄 셋업</button>
                        <button class="quick-btn" onclick="resetFeederSetup()">셋업 초기화</button>
                        <button class="quick-btn" style="background: rgba(56, 189, 248, 0.15); color: #38bdf8; border-color: rgba(56, 189, 248, 0.35);" onclick="simulateProductionStep(50)">
                            ⚡ 기판 +50장 생산
                        </button>
                        <button class="quick-btn" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5; border-color: rgba(239, 68, 68, 0.4);" onclick="simulateDrainReel()">
                            🚨 릴 잔량 5%로 소진 (테스트)
                        </button>
                    </div>
                </div>
            </div>

            <!-- Left Footer / Complete Action -->
            <div class="left-footer">
                <button id="btnCompleteKitting" class="btn-complete-kitting" disabled onclick="releaseAndGoToDashboard()">
                    인터록 해제 승인 & 라인 관제로 이동
                </button>
            </div>
        </aside>

        <!-- ── Right Column: Scrollable Feeder Slots Checklist ── -->
        <main class="right-checklist-col">
            <div class="right-header">
                <span class="checklist-title">
                    <span>마운터 피더 슬롯 & 실시간 릴 잔량 관제</span>
                </span>
                <div style="font-size: 11.5px; color: var(--text-dim); display:flex; align-items:center; gap:10px;">
                    <span>생산 실적: <b id="kpiActualQty" style="color:#38bdf8; font-family:'JetBrains Mono',monospace;">0</b> / <span id="kpiTargetQty" style="color:#fff;">-</span></span>
                </div>
            </div>

            <div class="checklist-scroll-area" id="kittingListContainer">
                <!-- 동적 풀-카드 배경 게이지 리스트 렌더링 -->
            </div>
        </main>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        function escHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        let currentWoId = null;
        let currentFeederData = null;
        let simulatedProducedQty = 0; // 실시간 릴 잔량 시뮬레이션용 생산 수량
        let slotSpliceOffset = {}; // 슬롯별 스플라이싱 시점 오프셋
        let slotSpliceReelQty = {}; // 슬롯별 스플라이싱된 신규 릴의 실제 정규 포장 수량 (기본 4,000 EA)

        const currentRole = localStorage.getItem('role');
        if (currentRole !== 'worker' && currentRole !== 'admin') {
            alert("접근 권한이 없습니다. 로그인해 주세요.");
            window.location.href = 'login.html';
        }

        if (currentRole === 'admin') {
            const adminLink = document.getElementById('btnAdminLink');
            if (adminLink) adminLink.style.display = 'inline-block';
        }

        function logout() {
            localStorage.removeItem('role');
            window.location.href = 'login.html';
        }

        // 초기 작업지시 목록 로드
        async function initWOList() {
            try {
                const res = await fetch('/backend/api/get_wo_list.php');
                const json = await res.json();
                const select = document.getElementById('woSelect');
                select.innerHTML = '';

                // 피킹/피더 셋업 화면은 SMT 준비 및 가동 전용이므로 SMT 완료 작업지시는 제외
                const kittingWOs = (json.data || []).filter(wo => wo.status === 'READY' || wo.status === 'IN_PROGRESS');

                if (json.status === 'success' && kittingWOs.length > 0) {
                    kittingWOs.forEach(wo => {
                        const opt = document.createElement('option');
                        opt.value = wo.wo_id;
                        const companyStr = wo.company_name ? `[${wo.company_name}] ` : '';
                        opt.innerText = `${companyStr}${wo.wo_id}`;
                        select.appendChild(opt);
                    });

                    // URL Query Parameter ?wo_id=... 확인 후 우선 선택
                    const urlParams = new URLSearchParams(window.location.search);
                    const paramWoId = urlParams.get('wo_id');
                    if (paramWoId && kittingWOs.some(w => w.wo_id === paramWoId)) {
                        select.value = paramWoId;
                        currentWoId = paramWoId;
                    } else {
                        currentWoId = kittingWOs[0].wo_id;
                    }
                    await loadKittingData(currentWoId);
                } else {
                    select.innerHTML = '<option value="">피더 셋업이 필요한 작업지시가 없습니다.</option>';
                }
            } catch (e) {
                console.error("작업지시 로드 실패:", e);
            }
        }

        async function onWoChanged() {
            const select = document.getElementById('woSelect');
            currentWoId = select.value;
            simulatedProducedQty = 0; slotSpliceOffset = {}; slotSpliceReelQty = {};
            if (currentWoId) {
                await loadKittingData(currentWoId);
            }
        }

        // 피더 데이터 로드
        async function loadKittingData(wo_id, highlightSlotNo = null) {
            try {
                const res = await fetch(`/backend/api/get_feeder_setup.php?wo_id=${encodeURIComponent(wo_id)}`);
                const json = await res.json();

                if (json.status !== 'success' || !json.data) {
                    alert(json.message || "피더 정보를 불러오지 못했습니다.");
                    return;
                }

                currentFeederData = json.data;
                renderKittingUI(json.data, highlightSlotNo);
            } catch (e) {
                console.error("피더 데이터 로드 실패:", e);
            }
        }

        function renderKittingUI(data, highlightSlotNo = null) {
            const elTarget = document.getElementById('kpiTargetQty');
            const elActual = document.getElementById('kpiActualQty');
            if (elTarget) elTarget.innerText = `${data.target_qty}개`;
            if (elActual) elActual.innerText = `${simulatedProducedQty}개`;

            // SVG 원형 도넛 게이지 및 텍스트 업데이트
            const circumference = 314.16;
            const percent = data.progress_percent || 0;
            const isFullyVerified = data.interlock_released || (data.verified_slots > 0 && data.verified_slots >= data.total_slots);

            const gaugeFill = document.getElementById('gaugeCircleFill');
            const percentText = document.getElementById('gaugePercentText');
            const countText = document.getElementById('gaugeCountText');
            const titleLabel = document.getElementById('gaugeTitleLabel');
            const subLabel = document.getElementById('gaugeSubLabel');

            if (isFullyVerified) {
                // 100% 피더 검증 완료 시: 파란색의 자삽(SMT) 생산 진행률 게이지로 자동 전환
                const targetQty = data.target_qty || 1;
                const prodPct = targetQty > 0 ? Math.min(100, Math.round((simulatedProducedQty / targetQty) * 100)) : 0;
                const prodOffset = circumference * (1 - (prodPct / 100));

                if (titleLabel) {
                    titleLabel.innerText = '⚡ 자삽 생산 진행률';
                    titleLabel.style.color = '#38bdf8';
                }
                if (percentText) {
                    percentText.innerText = `${prodPct}%`;
                    percentText.style.color = '#38bdf8';
                }
                if (countText) {
                    countText.innerText = `${simulatedProducedQty.toLocaleString()} / ${targetQty.toLocaleString()} EA`;
                    countText.style.color = '#7dd3fc';
                }
                if (subLabel) {
                    subLabel.innerText = '자삽 생산 실적';
                    subLabel.style.color = '#94a3b8';
                }
                if (gaugeFill) {
                    gaugeFill.style.strokeDashoffset = prodOffset;
                    gaugeFill.classList.remove('done');
                    gaugeFill.classList.add('production');
                }
            } else {
                // 피더 검증 진행 중 (<100%)
                const offset = circumference * (1 - (percent / 100));

                if (titleLabel) {
                    titleLabel.innerText = '피더 검증 진행률';
                    titleLabel.style.color = 'var(--text-muted)';
                }
                if (percentText) {
                    percentText.innerText = `${percent}%`;
                    percentText.style.color = '#ffffff';
                }
                if (countText) {
                    countText.innerText = `${data.verified_slots} / ${data.total_slots}`;
                    countText.style.color = '#93c5fd';
                }
                if (subLabel) {
                    subLabel.innerText = '장착 완료';
                    subLabel.style.color = 'var(--text-muted)';
                }
                if (gaugeFill) {
                    gaugeFill.style.strokeDashoffset = offset;
                    gaugeFill.classList.remove('production');
                    gaugeFill.classList.remove('done');
                }
            }

            const badge = document.getElementById('kpiInterlockBadge');
            const btnComplete = document.getElementById('btnCompleteKitting');

            if (data.interlock_released) {
                badge.className = 'interlock-badge badge-released';
                badge.innerText = '인터록 해제 승인';
                btnComplete.disabled = false;
            } else {
                badge.className = 'interlock-badge badge-locked';
                badge.innerText = `인터록 잠김 (${data.verified_slots}/${data.total_slots})`;
                btnComplete.disabled = true;
            }

            const container = document.getElementById('kittingListContainer');
            container.innerHTML = '';

            let targetCardElement = null;

            data.slots.forEach(slot => {
                const isVerified = (slot.status === 'VERIFIED');
                const isTargetHighlight = (highlightSlotNo && slot.slot_no === highlightSlotNo);
                
                // 포인트 (기판 1장당 소요 포인트 / 개소수)
                const points = Math.round(parseFloat(slot.points !== undefined && slot.points !== null ? slot.points : slot.req_qty)) || 1;
                const targetQty = data.target_qty || 100;
                const totalRequiredQty = points * targetQty; // 이번 작업지시 총 소요수량 (목표생산량 * 개소수)
                
                // 기입고량 (수주 BOM 입고 또는 사급 입고로 등록된 실제 입고 수량)
                const inboundQty = (slot.provide_qty && parseFloat(slot.provide_qty) > 0)
                    ? Math.round(parseFloat(slot.provide_qty))
                    : ((slot.inbound_qty && parseFloat(slot.inbound_qty) > 0) ? Math.round(parseFloat(slot.inbound_qty)) : 0);

                // 현재 피더에 장착된 릴의 실제 용량 (기입고량 우선, 스플라이싱 시 표준 신품 4,000 EA 팩 적용)
                const isSpliced = (slotSpliceReelQty[slot.slot_no] !== undefined);
                const activeReelCapacity = isSpliced
                    ? slotSpliceReelQty[slot.slot_no]
                    : (inboundQty > 0 ? inboundQty : (totalRequiredQty > 0 ? totalRequiredQty : 4000));

                // ── 실시간 릴 잔량 계산 로직 (스플라이싱 오프셋 차감 반영) ──
                const consumedSinceSplice = Math.max(0, simulatedProducedQty - (slotSpliceOffset[slot.slot_no] || 0));
                const totalConsumed = isVerified ? (points * consumedSinceSplice) : 0;
                const remainingQty = Math.max(0, activeReelCapacity - totalConsumed);
                const remainPct = isVerified ? Math.min(100, Math.max(0, Math.round((remainingQty / activeReelCapacity) * 100))) : 0;

                // 소요량 충족 여부 판정 (현재 릴 용량 >= 이번 작업지시 총 소요량)
                const isRequirementMet = (activeReelCapacity >= totalRequiredQty);

                // 잔량 상태 판정 (안전 >= 30%, 주의 10~29%, 위험 <= 10%)
                let gaugeClass = 'gauge-pending';
                let isCriticalLow = false;

                if (isVerified) {
                    if (remainPct >= 30) {
                        gaugeClass = 'gauge-safe';
                    } else if (remainPct > 10) {
                        gaugeClass = 'gauge-warning';
                    } else {
                        gaugeClass = 'gauge-danger'; // 물리적 릴 끝 도달 위험 (빨간색 게이지 유지!)
                        isCriticalLow = true;
                    }
                }

                let cardClass = `feeder-card-item ${gaugeClass}`;
                if (isTargetHighlight) {
                    cardClass += ' is-highlight';
                }
                if (isVerified) {
                    cardClass += ' is-clickable-card';
                }
                if (isCriticalLow) {
                    cardClass += ' card-critical-clickable';
                }

                // 2행 텍스트: 단일 자재 잔여 수량 표시 (수량만 표시)
                let liveInfoHtml = `<span style="color:#94a3b8; font-size:10.5px; font-family:'JetBrains Mono',monospace;">${inboundQty > 0 ? `기입고: <b style="color:#38bdf8;">${inboundQty.toLocaleString()}</b> EA` : `소요: <b style="color:#f8fafc;">${totalRequiredQty.toLocaleString()}</b> EA`}</span>`;
                if (isVerified) {
                    if (isCriticalLow) {
                        if (isRequirementMet) {
                            liveInfoHtml = `<span class="live-qty-info alert-state">수량: <b>${remainingQty.toLocaleString()}</b> EA <span style="font-size:9.5px; padding:1px 4px; border-radius:3px; background:rgba(52,211,153,0.2); color:#34d399; font-weight:700; margin-left:3px;">충족</span></span>`;
                        } else {
                            liveInfoHtml = `<span class="live-qty-info alert-state">수량: <b>${remainingQty.toLocaleString()}</b> EA <span style="font-size:9.5px; padding:1px 4px; border-radius:3px; background:rgba(239,68,68,0.25); color:#f87171; font-weight:700; margin-left:3px;">🚨 리필</span></span>`;
                        }
                    } else {
                        liveInfoHtml = `<span class="live-qty-info normal-state">수량: <b>${remainingQty.toLocaleString()}</b> EA</span>`;
                    }
                }

                const card = document.createElement('div');
                card.className = cardClass;
                card.id = `slot-card-${slot.slot_no}`;

                if (isVerified) {
                    card.onclick = () => quickSpliceSlot(slot.slot_no, slot.part_no);
                    if (isCriticalLow) {
                        card.title = `[#${slot.slot_no}] 자재 소진 임박 — 카드 클릭 시 신규 릴이 스캔/연결되어 잔량이 즉시 100%로 리필됩니다!`;
                    } else {
                        card.title = `[#${slot.slot_no}] 카드 클릭 시 신규 릴 스플라이싱 리필 (100% 충전)`;
                    }
                }

                card.innerHTML = `
                    <!-- Full-Card Background Gauge Layer (우측부터 줄어듦) -->
                    <div class="feeder-gauge-fill" style="width: ${isVerified ? remainPct : 0}%;"></div>

                    <!-- 1st Line: Slot Pill, Points Pill (좌측) & Live Remaining Qty (우측) -->
                    <div class="feeder-line-main" style="display:flex; justify-content:space-between; align-items:center;">
                        <div class="feeder-left-group" style="display:flex; align-items:center; gap:5px;">
                            <span class="slot-pill">#${slot.slot_no}</span>
                            <span class="points-pill">${points}P</span>
                        </div>
                        <div class="live-qty-wrap" style="flex-shrink:0;">
                            ${liveInfoHtml}
                        </div>
                    </div>

                    <!-- 2nd Line: Part Number / Part Name Dedicated (가로 전체 단독 배치) -->
                    <div class="feeder-line-sub" style="display:flex; align-items:center; width:100%; border-top:1px solid rgba(255,255,255,0.08); padding-top:4px; margin-top:2px;">
                        <span class="part-number-text" title="${escHtml(slot.part_no)}${slot.part_name ? ` (${escHtml(slot.part_name)})` : ''}" style="width:100%; font-size:12.5px; font-weight:800; color:#ffffff; font-family:'JetBrains Mono',monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                            ${escHtml(slot.part_no)}${slot.part_name && slot.part_name !== slot.part_no ? ` <span style="font-size:11px; font-weight:500; color:#cbd5e1; font-family:sans-serif;">(${escHtml(slot.part_name)})</span>` : ''}
                        </span>
                    </div>
                `;

                container.appendChild(card);

                if (isTargetHighlight) {
                    targetCardElement = card;
                }
            });

            // 스캔 매칭된 카드로 부드럽게 스크롤 이동
            if (targetCardElement) {
                targetCardElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function handleKeyScan(e) {
            if (e.key === 'Enter') {
                submitScan();
            }
        }

        async function submitScan() {
            const input = document.getElementById('scannerInput');
            const barcode = input.value.trim();
            if (!barcode) return;
            await executeScan(barcode);
            input.value = '';
            input.focus();
        }

        async function executeScan(reel_barcode) {
            const banner = document.getElementById('feedbackBanner');
            const text = document.getElementById('feedbackText');
            if (!currentWoId) return;

            try {
                const res = await fetch('/backend/api/scan_feeder.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        wo_id: currentWoId,
                        reel_barcode: reel_barcode
                    })
                });
                const json = await res.json();

                if (json.status === 'success') {
                    banner.className = 'feedback-banner success';
                    text.innerText = `[PASS 검증성공] ${json.message}`;
                    const matchedSlotNo = json.data ? json.data.slot_no : null;
                    await loadKittingData(currentWoId, matchedSlotNo);
                } else {
                    banner.className = 'feedback-banner error';
                    text.innerText = `[FAIL 검증실패] ${json.message}`;
                }
            } catch (e) {
                banner.className = 'feedback-banner error';
                text.innerText = "서버 통신 실패: " + e.message;
            }
        }

        // 퀵 시뮬레이션 도구들
        async function quickScanCorrect() {
            if (!currentFeederData || !currentFeederData.slots) return;
            const pendingSlot = currentFeederData.slots.find(s => s.status !== 'VERIFIED');
            if (!pendingSlot) {
                alert("모든 슬롯이 이미 검증 완료되었습니다.");
                return;
            }

            const matchedReel = currentFeederData.available_reels ? currentFeederData.available_reels.find(r => r.part_no === pendingSlot.part_no) : null;
            const barcode = matchedReel ? matchedReel.reel_barcode : pendingSlot.part_no;
            document.getElementById('scannerInput').value = barcode;
            await executeScan(barcode);
        }

        async function quickScanWrong() {
            const wrongBarcode = 'REEL-WRONG-CAP100';
            document.getElementById('scannerInput').value = wrongBarcode;
            await executeScan(wrongBarcode);
        }

        async function autoVerifyAll() {
            if (!currentWoId) return;
            try {
                simulatedProducedQty = 0;
                slotSpliceOffset = {};
                slotSpliceReelQty = {};
                const res = await fetch('/backend/api/reset_feeder_setup.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ wo_id: currentWoId, action: 'auto_verify' })
                });
                const json = await res.json();
                if (json.status === 'success') {
                    const banner = document.getElementById('feedbackBanner');
                    const text = document.getElementById('feedbackText');
                    if (banner && text) {
                        banner.className = 'feedback-banner success';
                        text.innerText = `[100% 일괄 셋업 완료] 모든 피더 슬롯의 검증이 완료되고 잔량이 100% 충전되었습니다.`;
                    }
                }
                await loadKittingData(currentWoId);
            } catch (e) {
                alert("일괄 셋업 실패: " + e.message);
            }
        }

        async function resetFeederSetup() {
            if (!currentWoId) return;
            try {
                simulatedProducedQty = 0; slotSpliceOffset = {}; slotSpliceReelQty = {};
                const res = await fetch('/backend/api/reset_feeder_setup.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ wo_id: currentWoId, action: 'reset' })
                });
                await loadKittingData(currentWoId);
            } catch (e) {
                alert("초기화 실패: " + e.message);
            }
        }

        // ⚡ 1-클릭 자재카드 스플라이싱 & 잔량 100% 즉시 리필 함수
        async function quickSpliceSlot(slotNo, partNo) {
            if (!currentWoId) return;

            // 신규 릴 바코드 생성 (예: REEL-MBR0530-B102)
            const cleanPn = (partNo || 'PART').replace(/[^a-zA-Z0-9]/g, '').slice(0, 10);
            const randCode = Math.floor(Math.random() * 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
            const autoNewReel = `REEL-${cleanPn}-${randCode}`;

            try {
                const res = await fetch('/backend/api/scan_feeder.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        wo_id: currentWoId,
                        slot_no: slotNo,
                        part_no: partNo,
                        reel_barcode: autoNewReel,
                        action: 'splice'
                    })
                });
                const json = await res.json();

                if (json.status === 'success') {
                    // 스플라이싱 시 표준 신품 완제품 릴(Full Reel 4,000 EA)을 장착하여 넉넉하게 리필!
                    const currentSlot = currentFeederData && currentFeederData.slots ? currentFeederData.slots.find(s => s.slot_no === slotNo) : null;
                    const slotPoints = currentSlot ? (Math.round(parseFloat(currentSlot.points || currentSlot.req_qty)) || 1) : 1;
                    const standardFullPack = (slotPoints > 10 ? 5000 : 4000);
                    
                    slotSpliceReelQty[slotNo] = standardFullPack;
                    slotSpliceOffset[slotNo] = simulatedProducedQty;

                    const banner = document.getElementById('feedbackBanner');
                    const text = document.getElementById('feedbackText');
                    if (banner && text) {
                        banner.className = 'feedback-banner success';
                        text.innerText = `[스플라이싱 리필 완료] #${slotNo} [${partNo}] 신규 표준 릴(${autoNewReel}, ${standardFullPack.toLocaleString()} EA)이 연결되어 잔량이 100%로 완충되었습니다!`;
                    }

                    await loadKittingData(currentWoId, slotNo);
                } else {
                    alert('스플라이싱 검증 실패: ' + json.message);
                }
            } catch (e) {
                alert('통신 오류: ' + e.message);
            }
        }

        // 실시간 생산 진행에 따른 릴 잔량 차감 시뮬레이션
        function simulateProductionStep(step = 50) {
            if (!currentFeederData || !currentFeederData.slots) return;
            const hasVerified = currentFeederData.slots.some(s => s.status === 'VERIFIED');
            if (!hasVerified) {
                alert("먼저 부품 릴을 스캔하거나 [100% 일괄 셋업]을 진행해 주세요.");
                return;
            }
            simulatedProducedQty += step;
            renderKittingUI(currentFeederData);
        }

        function simulateDrainReel() {
            if (!currentFeederData || !currentFeederData.slots) return;
            const hasVerified = currentFeederData.slots.some(s => s.status === 'VERIFIED');
            if (!hasVerified) {
                alert("먼저 [100% 일괄 셋업]을 완료해 주세요.");
                return;
            }

            // 모든 검증 슬롯의 잔량이 정확히 5%(소진 임박)가 되도록 오프셋 계산
            currentFeederData.slots.forEach(slot => {
                if (slot.status === 'VERIFIED') {
                    const points = Math.round(parseFloat(slot.points !== undefined && slot.points !== null ? slot.points : slot.req_qty)) || 1;
                    const targetQty = currentFeederData.target_qty || 100;
                    const totalRequiredQty = points * targetQty;
                    const inboundQty = (slot.provide_qty && parseFloat(slot.provide_qty) > 0)
                        ? Math.round(parseFloat(slot.provide_qty))
                        : ((slot.inbound_qty && parseFloat(slot.inbound_qty) > 0) ? Math.round(parseFloat(slot.inbound_qty)) : 0);
                    const isSpliced = (slotSpliceReelQty[slot.slot_no] !== undefined);
                    const activeCapacity = isSpliced
                        ? slotSpliceReelQty[slot.slot_no]
                        : (inboundQty > 0 ? inboundQty : (totalRequiredQty > 0 ? totalRequiredQty : 4000));

                    const drainQty = Math.floor(activeCapacity * 0.95);
                    const consumedSteps = Math.floor(drainQty / points);
                    slotSpliceOffset[slot.slot_no] = simulatedProducedQty - consumedSteps;
                }
            });

            renderKittingUI(currentFeederData);
            const banner = document.getElementById('feedbackBanner');
            const text = document.getElementById('feedbackText');
            if (banner && text) {
                banner.className = 'feedback-banner';
                text.innerText = '🚨 모든 슬롯의 릴 잔량이 5%(소진 임박)로 감축되었습니다. 충전할 자재 카드를 클릭하면 즉시 100%로 리필됩니다!';
            }
        }

        function releaseAndGoToDashboard() {
            const role = localStorage.getItem('userRole') || '';
            if (role === 'admin' || role === 'line_lead') {
                alert("피더 셋업 검증이 100% 완료되었습니다. SMT 라인 가동 콘솔로 이동합니다.");
                window.location.href = 'dashboard.html';
            } else {
                alert("피더 셋업 검증이 100% 완료되어 SMT 인터록이 정상 해제되었습니다.\n라인 반장이 라인을 가동할 수 있습니다.");
            }
        }

        // 실시간 SMT 라인 생산 실적 동기화 (1.5초 주기 폴링, 현재 작업지시 기준)
        async function syncLiveProductionQty() {
            if (!currentWoId) return;
            try {
                const res = await fetch(`/backend/api/get_kpi.php?wo_id=${encodeURIComponent(currentWoId)}`);
                const json = await res.json();
                if (json.status === 'success' && json.data && json.data.wo_id === currentWoId) {
                    const serverActual = parseInt(json.data.actual_qty) || 0;
                    // 실제 설비에서 생산이 진행되어 실적이 증가했을 때만 동기화
                    if (serverActual > 0 && serverActual > simulatedProducedQty) {
                        simulatedProducedQty = serverActual;
                        if (currentFeederData) {
                            renderKittingUI(currentFeederData);
                        }
                    }
                }
            } catch (e) {
                // 조용한 오류 처리
            }
        }

        // 초기화 및 실시간 동기화 루프 가동
        initWOList();
        setInterval(syncLiveProductionQty, 1500);

        /* ── 자재 스플라이싱(Splicing) 모달 및 검증 로직 ── */
        let currentSpliceSlotNo = null;

        function openSpliceModal(slotNo, partNo, currentReel) {
            currentSpliceSlotNo = slotNo;
            document.getElementById('spliceSlotLabel').innerText = `#${slotNo}`;
            document.getElementById('splicePartLabel').innerText = partNo;
            document.getElementById('spliceOldReelLabel').innerText = currentReel || '(미장착)';
            
            const fb = document.getElementById('spliceFeedback');
            fb.style.display = 'none';
            fb.className = 'splice-feedback';
            fb.innerText = '';

            const input = document.getElementById('spliceReelInput');
            input.value = '';
            
            document.getElementById('spliceModalOverlay').style.display = 'flex';
            setTimeout(() => input.focus(), 150);
        }

        function closeSpliceModal() {
            document.getElementById('spliceModalOverlay').style.display = 'none';
            currentSpliceSlotNo = null;
        }

        async function submitSpliceScan() {
            const input = document.getElementById('spliceReelInput');
            const newReelBarcode = input.value.trim();
            const fb = document.getElementById('spliceFeedback');

            if (!newReelBarcode) {
                fb.className = 'splice-feedback error';
                fb.innerText = '신규 릴 바코드를 입력하거나 스캔하세요.';
                fb.style.display = 'block';
                return;
            }

            if (!currentWoId || !currentSpliceSlotNo) return;

            try {
                const res = await fetch('/backend/api/scan_feeder.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        wo_id: currentWoId,
                        slot_no: currentSpliceSlotNo,
                        reel_barcode: newReelBarcode,
                        action: 'splice'
                    })
                });
                const json = await res.json();

                if (json.status === 'success') {
                    fb.className = 'splice-feedback success';
                    fb.innerText = `✅ ${json.message}`;
                    fb.style.display = 'block';

                    const banner = document.getElementById('feedbackBanner');
                    const text = document.getElementById('feedbackText');
                    if (banner && text) {
                        banner.className = 'feedback-banner success';
                        text.innerText = `[스플라이싱 성공] ${json.message}`;
                    }

                    await loadKittingData(currentWoId, currentSpliceSlotNo);
                    setTimeout(() => {
                        closeSpliceModal();
                    }, 1200);
                } else {
                    fb.className = 'splice-feedback error';
                    fb.innerText = `🚨 ${json.message}`;
                    fb.style.display = 'block';
                    input.select();
                }
            } catch (e) {
                fb.className = 'splice-feedback error';
                fb.innerText = '통신 오류: ' + e.message;
                fb.style.display = 'block';
            }
        }

    </script>
    <!-- Header Navigation Controller -->
    <script src="js/header.js"></script>

    <!-- Splice Modal Overlay -->
    <div id="spliceModalOverlay" class="splice-modal-overlay" style="display:none;">
        <div class="splice-modal-card">
            <div class="splice-modal-header">
                <div style="display:flex; align-items:center; gap:8px;">
                    <span style="font-size:18px;">🔗</span>
                    <h3 style="margin:0; font-size:16px; font-weight:800; color:#f8fafc;">자재 스플라이싱(Splicing) 검증</h3>
                </div>
                <button type="button" class="splice-close-btn" onclick="closeSpliceModal()">&times;</button>
            </div>
            <div class="splice-modal-body">
                <div class="splice-info-box">
                    <div class="splice-info-row">
                        <span class="splice-label">대상 슬롯</span>
                        <span id="spliceSlotLabel" class="splice-val-slot">#1</span>
                    </div>
                    <div class="splice-info-row">
                        <span class="splice-label">BOM 필요 부품</span>
                        <span id="splicePartLabel" class="splice-val-part">SKRPACE010</span>
                    </div>
                    <div class="splice-info-row">
                        <span class="splice-label">현재 장착 릴</span>
                        <span id="spliceOldReelLabel" class="splice-val-reel">REEL-69dec11a</span>
                    </div>
                </div>

                <div style="margin-top:16px;">
                    <label style="display:block; font-size:12.5px; font-weight:700; color:#93c5fd; margin-bottom:6px;">
                        ⚡ 새로 이어 붙일 신규 릴 바코드 스캔 / 입력
                    </label>
                    <div style="display:flex; gap:8px;">
                        <input type="text" id="spliceReelInput" class="splice-input" placeholder="신규 릴 바코드를 스캔하세요" onkeydown="if(event.key==='Enter') submitSpliceScan()">
                        <button type="button" class="splice-submit-btn" onclick="submitSpliceScan()">검증 및 연결</button>
                    </div>
                </div>

                <div id="spliceFeedback" class="splice-feedback" style="display:none;"></div>
            </div>
        </div>
    </div>
</body>
