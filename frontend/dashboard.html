<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES 실시간 관제 대시보드</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <header class="kpi-header">
        <div>
            <h1>SMT / DIP 생산 라인 통합 관제</h1>
            <span class="status-indicator">● LIVE</span>
        </div>
        <div class="kpi-board">
            <div class="kpi-box">목표: <span>1,000</span></div>
            <div class="kpi-box">생산: <span id="val-actual">0</span></div>
            <div class="kpi-box highlight">수율: <span id="val-yield">100.0%</span></div>
        </div>
    </header>

    <main class="factory-line">
        <!-- 자삽(SMT) 라인 -->
        <div class="machine wait" id="mac-LASER">
            <div class="mac-title">Laser Marker</div>
            <div class="mac-data" id="data-LASER">-</div>
        </div>
        <div class="arrow">▶</div>
        <div class="machine wait" id="mac-SPI">
            <div class="mac-title">SPI 검사</div>
            <div class="mac-data" id="data-SPI">-</div>
        </div>
        <div class="arrow">▶</div>
        <div class="machine wait" id="mac-MOUNTER">
            <div class="mac-title">고속 마운터</div>
            <div class="mac-data" id="data-MOUNTER">-</div>
        </div>
        <div class="arrow">▶</div>
        <div class="machine wait" id="mac-REFLOW">
            <div class="mac-title">Reflow Oven</div>
            <div class="mac-data" id="data-REFLOW">-</div>
        </div>
        
        <div class="arrow" style="color: #fbbf24;">▶ (수삽 이동) ▶</div>
        
        <!-- 수삽(DIP) 라인 -->
        <div class="machine wait" id="mac-DIP_AOI">
            <div class="mac-title">수삽 AOI</div>
            <div class="mac-data" id="data-DIP_AOI">-</div>
        </div>
        <div class="arrow">▶</div>
        <div class="machine wait" id="mac-WAVE">
            <div class="mac-title">Wave Soldering</div>
            <div class="mac-data" id="data-WAVE">-</div>
        </div>
    </main>

    <footer class="terminal-log">
        <div class="log-header">설비 실시간 수신 로그 (Node-RED)</div>
        <ul id="log-list">
            <li>시스템 대기 중... 데이터를 수신하세요.</li>
        </ul>
    </footer>

    <script src="js/dashboard.js"></script>
</body>
</html>
