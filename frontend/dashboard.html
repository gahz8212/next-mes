<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SMT 실시간 모니터링</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1000px; margin: 0 auto; }
        .stat-number { font-size: 48px; font-weight: bold; margin: 10px 0; color: var(--primary-color); }
        .progress-bar { width: 100%; background: #E2E8F0; border-radius: 8px; height: 24px; overflow: hidden; }
        .progress-fill { background: var(--success-color); height: 100%; transition: width 0.5s ease; }
        .log-item { padding: 10px; border-bottom: 1px solid #E2E8F0; font-size: 14px; }
        .badge-pass { background: #D1FAE5; color: #065F46; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .badge-fail { background: #FEE2E2; color: #991B1B; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">🎯 LINE 01 실시간 대시보드</h2>

    <div class="dashboard-grid">
        <!-- 생산 진척도 카드 -->
        <div class="card">
            <h3 style="margin-top:0; color: #64748B;">현재 작업지시 (WO)</h3>
            <div id="wo_id" style="font-size: 18px; font-weight: bold;">로딩중...</div>
            
            <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                <div>
                    <div style="color: #64748B;">목표 수량</div>
                    <div class="stat-number" id="target_qty" style="color: var(--text-main);">0</div>
                </div>
                <div style="text-align: right;">
                    <div style="color: #64748B;">양품(PASS) 생산량</div>
                    <div class="stat-number" id="pass_qty" style="color: var(--success-color);">0</div>
                </div>
            </div>

            <div style="margin-top: 10px;">
                <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px;">
                    <span>달성률</span>
                    <span id="achieve_rate" style="font-weight: bold;">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress_fill" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <!-- 실시간 공정 로그 카드 -->
        <div class="card">
            <h3 style="margin-top:0; color: #64748B;">실시간 공정 통과 로그</h3>
            <div id="log_container">
                <!-- 로그가 여기에 삽입됩니다 -->
            </div>
        </div>
    </div>

    <script>
        async function fetchDashboard() {
            try {
                const res = await fetch('../backend/api/get_dashboard.php');
                const data = await res.json();

                if (data.status === 'success' && data.work_order) {
                    const wo = data.work_order;
                    document.getElementById('wo_id').innerText = wo.wo_id;
                    document.getElementById('target_qty').innerText = wo.target_qty;
                    document.getElementById('pass_qty').innerText = wo.pass_qty;
                    
                    // 달성률 계산
                    const rate = (wo.pass_qty / wo.target_qty * 100).toFixed(1);
                    document.getElementById('achieve_rate').innerText = rate + '%';
                    document.getElementById('progress_fill').style.width = rate + '%';
                }

                if (data.status === 'success' && data.recent_logs) {
                    const logHtml = data.recent_logs.map(log => {
                        const badgeClass = log.result_status === 'PASS' ? 'badge-pass' : 'badge-fail';
                        return `
                            <div class="log-item">
                                <span class="${badgeClass}">${log.result_status}</span>
                                <span style="margin-left: 10px; font-weight: bold;">${log.barcode}</span>
                                <span style="color: #64748B; margin-left: 10px;">${log.process_name}</span>
                            </div>
                        `;
                    }).join('');
                    document.getElementById('log_container').innerHTML = logHtml;
                }
            } catch (err) {
                console.error("데이터 갱신 실패", err);
            }
        }

        // 페이지 로드 시 1회 실행 후, 2초마다 자동 갱신
        fetchDashboard();
        setInterval(fetchDashboard, 2000);
    </script>
</body>
</html>
